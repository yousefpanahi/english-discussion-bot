name: Telegram English Discussion Bot

on:
  schedule:
    # Monday, Wednesday, Saturday — 13:30 UTC
    - cron: "30 13 * * 1,3,6"

    # Monday, Wednesday, Saturday — 16:30 UTC
    - cron: "30 16 * * 1,3,6"

  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Send reminder
        if: github.event.schedule == '30 13 * * 1,3,6'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: reminder
        run: python bot.py

      - name: Send join message
        if: github.event.schedule == '30 16 * * 1,3,6'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: join
        run: python bot.py
