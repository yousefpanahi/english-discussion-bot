name: Telegram English Discussion Bot

permissions:
  contents: write

on:
  schedule:
    # Start early. Python waits until exactly 17:00 Tehran.
    - cron: "17 10 * * 1,3,6"

    # Start early. Python waits until exactly 20:00 Tehran.
    # The Join message stays pinned for 3 hours.
    - cron: "17 14 * * 1,3,6"

    # Start early. Python waits until exactly 22:00 Tehran.
    - cron: "17 15 * * 1,3,6"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Which message do you want to test?"
        required: true
        type: choice
        options:
          - reminder
          - join
          - bbc

jobs:
  send-message:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      # ---------------------------------------
      # REMINDER — EXACTLY 17:00 TEHRAN
      # ---------------------------------------

      - name: Send reminder
        if: |
          github.event.schedule == '17 10 * * 1,3,6' ||
          github.event.inputs.message_type == 'reminder'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: reminder
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '17:00' || '' }}
        run: python bot.py

      # ---------------------------------------
      # JOIN CLASS — EXACTLY 20:00 TEHRAN
      # PIN FOR 3 HOURS
      # ---------------------------------------

      - name: Send join message
        if: |
          github.event.schedule == '17 14 * * 1,3,6' ||
          github.event.inputs.message_type == 'join'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: join
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '20:00' || '' }}
          UNPIN_DELAY_SECONDS: ${{ github.event_name == 'schedule' && '10800' || '20' }}
        run: python bot.py

      # ---------------------------------------
      # BBC EPISODE — EXACTLY 22:00 TEHRAN
      # ---------------------------------------

      - name: Send BBC episode
        if: |
          github.event.schedule == '17 15 * * 1,3,6' ||
          github.event.inputs.message_type == 'bbc'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: bbc
          TARGET_TEHRAN_TIME: ${{ github.event_name == 'schedule' && '22:00' || '' }}
        run: python bot.py

      # ---------------------------------------
      # SAVE EPISODE COUNTER
      # ---------------------------------------

      - name: Save episode counter
        if: |
          github.event.schedule == '17 15 * * 1,3,6' ||
          github.event.inputs.message_type == 'bbc'
        run: |
          git config user.name "Telegram Discussion Bot"
          git config user.email "bot@users.noreply.github.com"
          git add episode_counter.txt
          git diff --cached --quiet || git commit -m "Update BBC episode counter"
          git push
