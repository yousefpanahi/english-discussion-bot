name: Telegram English Discussion Bot
permissions:
  contents: write
on:
  schedule:
    # Monday, Wednesday, Saturday — 13:30 UTC
    - cron: "30 13 * * 1,3,6"

    # Monday, Wednesday, Saturday — 16:30 UTC
    - cron: "30 16 * * 1,3,6"

    # Monday, Wednesday, Saturday — 18:30 UTC
    - cron: "30 18 * * 1,3,6"

  workflow_dispatch:
    inputs:
      message_type:
        description: "Which message do you want to test?"
        required: true
        type: choice
        options:
          - reminder
          - join
          - bbc

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      # ---------------------------------------
      # REMINDER — 13:30 UTC
      # ---------------------------------------

      - name: Send reminder
        if: |
          github.event.schedule == '30 13 * * 1,3,6' ||
          github.event.inputs.message_type == 'reminder'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: reminder
        run: python bot.py

      # ---------------------------------------
      # JOIN CLASS — 16:30 UTC
      # ---------------------------------------

      - name: Send join message
        if: |
          github.event.schedule == '30 16 * * 1,3,6' ||
          github.event.inputs.message_type == 'join'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: join
        run: python bot.py

      # ---------------------------------------
      # BBC EPISODE — 18:30 UTC
      # ---------------------------------------

      - name: Send BBC episode
        if: |
          github.event.schedule == '30 18 * * 1,3,6' ||
          github.event.inputs.message_type == 'bbc'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MESSAGE_TYPE: bbc
        run: python bot.py

      # ---------------------------------------
      # SAVE EPISODE COUNTER
      # ---------------------------------------

      - name: Save episode counter
        if: |
          github.event.schedule == '30 18 * * 1,3,6' ||
          github.event.inputs.message_type == 'bbc'
        run: |
          git config user.name "Telegram Discussion Bot"
          git config user.email "bot@users.noreply.github.com"
          git add episode_counter.txt
          git diff --cached --quiet || git commit -m "Update BBC episode counter"
          git push
